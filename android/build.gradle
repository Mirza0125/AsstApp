// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath('com.google.gms:google-services:4.4.2')
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// react-native-gesture-handler registers its paper codegen sources under the Kotlin
// source set, so AGP 8 never compiles them and NativeRNGestureHandlerModuleSpec ends
// up missing from the AAR. Register the same directory with the Java source set.
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        if (subproject.name == 'react-native-gesture-handler'
                && project.findProperty('newArchEnabled') != 'true') {
            subproject.android.sourceSets.main.java.srcDirs +=
                    ["${subproject.projectDir}/paper/src/main/java"]
        }
    }
}
